name: Auto-Pilot Kavach Rules Engine

on:
  schedule:
    # रोज़ाना 02:00 UTC (भारतीय समय सुबह 07:30)
    - cron: '0 2 * * *'
  push:
    branches: [ "main", "master" ]
    paths:
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: blocklist-auto-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auto-update-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Build rules
        run: python scripts/generate_blocklists.py

      - name: Commit and push (only if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rules/
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Auto-Pilot: rules updated [$(date -u +'%Y-%m-%d %H:%M UTC')] [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
