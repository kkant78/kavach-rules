name: Auto-Pilot Kavach Rules Engine

on:
  schedule:
    # रोज़ाना सुबह 02:00 AM UTC (भारतीय समय अनुसार सुबह 07:30 AM) पर अपने आप चलेगा
    - cron: '0 2 * * *'
  push:
    branches: [ "main", "master" ]
    paths:
      - 'scripts/**'
  workflow_dispatch: # जरूरत पड़ने पर मैन्युअल चलाने का विकल्प भी रहेगा

# डुप्लीकेट बिल्ड रोकने के लिए
concurrency:
  group: blocklist-auto-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auto-update-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install High-Speed Dependencies
        run: |
          pip install requests dnspython urllib3

      - name: Run Full Auto-Pilot Processing (Fetch, Clean, Merge, Tier)
        run: |
          python scripts/generate_blocklists.py

      - name: Auto-Commit and Push Fresh Rules to Repository
        run: |
          git config --global user.name "Kavach-AutoBot[bot]"
          git config --global user.email "kavach-autobot[bot]@users.noreply.github.com"
          git add rules/
          if git diff --staged --quiet; then
            echo "No domain changes detected today. Rules are already up-to-date."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Auto-Pilot: Fresh Rules Updated [$TIMESTAMP] [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Successfully updated and pushed fresh Kavach blocklists!"
          fi
