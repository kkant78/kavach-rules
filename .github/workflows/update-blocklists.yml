name: Auto-Pilot Kavach Rules & Code Exporter

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [ "main", "master" ]
    paths:
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: blocklist-auto-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auto-update-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install High-Speed Dependencies
        run: |
          pip install requests dnspython urllib3

      - name: Run Full Auto-Pilot & Generate Code Files
        run: |
          python scripts/generate_blocklists.py

      - name: Auto-Commit and Push Rules & Code Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/ app-code/
          if git diff --staged --quiet; then
            echo "No changes detected today."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Auto-Pilot: Fresh Rules & App Code Exported [$TIMESTAMP] [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Successfully updated and pushed rules & app code!"
          fi
